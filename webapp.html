<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prayer Times</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color, #0e1829);
  --card: var(--tg-theme-secondary-bg-color, #16233a);
  --text: var(--tg-theme-text-color, #eef2f8);
  --hint: var(--tg-theme-hint-color, #8b98ad);
  --link: var(--tg-theme-link-color, #d4af37);
  --gold: #d4af37;
  --gold-soft: rgba(212,175,55,.16);
  --green: #22a37a;
  --green-soft: rgba(34,163,122,.16);
  --line: rgba(127,140,160,.18);
  --safe-top: var(--tg-content-safe-area-inset-top, 0px);
  --safe-bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
  --nav-h: 64px;
  --on-gold: #1b1404;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{padding:calc(12px + var(--safe-top)) 16px calc(var(--nav-h) + var(--safe-bottom) + 20px);max-width:560px;margin:0 auto}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.2px}
h2{font-size:17px;margin:20px 0 10px}
.sub{color:var(--hint);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--hint)}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:600;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;background:var(--gold);color:var(--on-gold);font-weight:700}
.btn.ghost{background:var(--card);color:var(--text)}
.state{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.state .big{font-size:56px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .place{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* today */
.ring-wrap{position:relative;width:240px;height:240px;margin:16px auto 6px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{stroke:var(--line);fill:none;stroke-width:14}
.ring-fg{stroke:url(#gold);fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-in .label{color:var(--hint);font-size:13px}
.ring-in .name{font-size:22px;font-weight:800;margin:2px 0}
.ring-in .left{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.ring-in .at{color:var(--gold);font-weight:600;margin-top:2px}
.times .t{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.times .t:last-child{border-bottom:0}
.times .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--gold-soft);font-size:18px}
.times .nm{flex:1;font-weight:600}
.times .tm{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.times .t.now{background:var(--green-soft);border-radius:12px;border-bottom-color:transparent}
.times .t.now .ico{background:var(--green);}
.times .t.next .tm{color:var(--gold)}
.times .t.past .nm,.times .t.past .tm{opacity:.55}

/* qibla */
.compass{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:18px auto 8px}
.compass .dial{position:absolute;inset:0;will-change:transform;transform:translateZ(0)}
.compass .marker{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid var(--gold);z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.compass.ok .marker{border-top-color:var(--green)}
.compass .glow{position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 0 rgba(34,163,122,0);transition:box-shadow .3s}
.compass.ok .glow{box-shadow:0 0 0 6px rgba(34,163,122,.5),0 0 40px rgba(34,163,122,.55)}
.compass .hub{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--gold);z-index:2}
.qinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qinfo .card{margin:0;text-align:center}
.qinfo b{display:block;font-size:22px}
.qstatus{text-align:center;font-weight:700;font-size:17px;margin:6px 0 2px;min-height:24px}
.qstatus.ok{color:var(--green)}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.calnav button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:18px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.tbl th{color:var(--hint);font-weight:600;padding:8px 2px;position:sticky;top:0;background:var(--card)}
.tbl td{padding:8px 2px;text-align:center;border-top:1px solid var(--line)}
.tbl td:first-child{text-align:left;padding-left:6px}
.tbl tr.today td{background:var(--gold-soft);font-weight:800}
.tbl tr.fri td:first-child{color:var(--green)}
.tbl .h{display:block;color:var(--hint);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}
.scroll{overflow:auto;border-radius:18px;background:var(--card);max-height:62vh}

/* tasbih */
.dhikr{text-align:center;margin-top:8px}
.dhikr .ar{font-size:30px;font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;direction:rtl}
.dhikr .tr{color:var(--hint)}
.bead{display:block;width:min(70vw,250px);aspect-ratio:1;margin:18px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d77a,var(--gold) 45%,#8a6d14);box-shadow:0 18px 40px rgba(212,175,55,.35),inset 0 -10px 30px rgba(0,0,0,.25);color:var(--on-gold);transition:transform .08s}
.bead:active{transform:scale(.96)}
.bead .n{font-size:64px;font-weight:900;line-height:1}
.bead .g{font-weight:700;opacity:.75}
.goals{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.goals button{padding:8px 16px;border-radius:999px;background:var(--card);font-weight:700}
.goals button.on{background:var(--gold);color:var(--on-gold)}

/* more */
.menu .item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card);margin:10px 0;width:100%;text-align:start}
.menu .item .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--gold-soft)}
.menu .item .tt{font-weight:700}
.menu .item .ds{color:var(--hint);font-size:13px}
.menu .item .ch{margin-inline-start:auto;color:var(--hint);font-size:20px}
.comm{display:flex;align-items:center;gap:12px;width:100%;text-align:start;cursor:pointer}
.comm .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--green-soft);flex:none}
.comm b{color:var(--green)}
.chc .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chc .tt{font-weight:800;font-size:16px}
.chc .pr{height:6px;border-radius:9px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.chc .pr div{height:100%;background:var(--gold);border-radius:9px}
.chc .mb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.chc .mb:last-of-type{border-bottom:0}
.chc .mb .rk{width:26px;text-align:center;font-weight:800;color:var(--hint)}
.chc .mb .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chc .mb.me .nm{color:var(--gold)}
.chc .dots{display:flex;gap:3px}
.chc .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chc .dots i.on{background:var(--green)}
.chc .sc{font-weight:800;min-width:44px;text-align:end}
.chc .acts{display:flex;gap:8px;margin-top:10px}
.chc .acts .btn{padding:10px}
.backbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.backbar button{font-size:15px;color:var(--link);padding:6px 0}

/* tracker */
.checks .c{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.checks .c:last-child{border-bottom:0}
.checks .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff;transition:.15s}
.checks .c.on .box{background:var(--green);border-color:var(--green)}
.checks .c .nm{flex:1;font-weight:600}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .bar{width:100%;border-radius:8px;background:var(--gold);min-height:4px;transition:height .3s}
.week .bar.full{background:var(--green)}
.week .lb{font-size:11px;color:var(--hint)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card{margin:0;text-align:center}
.stat b{display:block;font-size:24px}

/* ramadan */
.count{font-size:38px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}

/* mosques */
#map{height:44vh;border-radius:18px;overflow:hidden;margin:10px 0;background:var(--card)}
.mlist .m{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.mlist .m:last-child{border-bottom:0}
.mlist .m .nm{flex:1;min-width:0}
.mlist .m .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist .m a,.mlist .m button.go{color:var(--link);font-weight:700;white-space:nowrap}

/* names */
.search{width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--card);color:var(--text);font:inherit;margin:6px 0}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names .nm{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.names .no{color:var(--hint);font-size:11px}
.names .ar{font-size:24px;font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;direction:rtl;margin:2px 0}
.names .tr{font-weight:700;font-size:13px}
.names .mn{color:var(--hint);font-size:12px;margin-top:2px}


/* settings */
.lbl{color:var(--hint);font-size:13px;font-weight:600;margin-bottom:8px}
.cur{font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--bg);font-weight:600;font-size:14px;border:1px solid var(--line)}
.chip.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;cursor:pointer}
.sw .tg{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw .tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on .tg{background:var(--green)}
.sw.on .tg::after{inset-inline-start:23px}
.found{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:20;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* azkar & duas */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-top:10px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--hint)}
.seg button.on{background:var(--gold);color:var(--on-gold)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.prog div{height:100%;width:0;background:var(--green);transition:width .3s}
.zk{display:block;width:100%;text-align:start;background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0;border:2px solid transparent;transition:.2s}
.zk.done{border-color:var(--green);opacity:.75}
.zk .ar,.du .ar{font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;font-size:22px;line-height:1.9;direction:rtl;text-align:right}
.zk .tl,.du .tl{color:var(--gold);font-style:italic;font-size:13px;margin-top:6px}
.zk .mn,.du .mn{font-size:14px;margin-top:6px}
.zk .ft,.du .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--hint);font-size:12px}
.zk .cnt{font-weight:800;font-size:14px;color:var(--text);background:var(--gold-soft);padding:4px 12px;border-radius:999px}
.zk.done .cnt{background:var(--green);color:#fff}
.du{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0}
.du .tt{font-weight:800;margin-bottom:4px}

/* qada */
.qd .r{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.qd .r:last-child{border-bottom:0}
.qd .nm{flex:1;font-weight:600}
.qd .n{min-width:52px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.qd .pm{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:20px;font-weight:800;border:1px solid var(--line)}
.qd .pm.ok{background:var(--green);color:#fff;border-color:var(--green)}

/* islamic dates */
.ev .e{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.ev .e:last-child{border-bottom:0}
.ev .ic{width:40px;height:40px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:20px;flex:none}
.ev .nm{flex:1;min-width:0}
.ev .nm b{display:block}
.ev .left{font-weight:800;color:var(--gold);white-space:nowrap}
.ev .e.today .left{color:var(--green)}
.cvres{margin-top:12px;font-size:18px;font-weight:800;text-align:center;min-height:26px}
select.search{appearance:none;-webkit-appearance:none}

/* stage 2 */
.share{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.share .btn:only-child{grid-column:1 / -1}
.citycard b{font-size:16px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cgrid div{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.cgrid span{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgrid b{font-variant-numeric:tabular-nums}
.cgrid .nx{background:var(--gold-soft);outline:2px solid var(--gold)}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcal .hd{text-align:center;color:var(--hint);font-size:11px;font-weight:700}
.mcal .dc{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--line);font-variant-numeric:tabular-nums}
.mcal .dc.full{background:var(--green);color:#fff}
.mcal .dc.fu{opacity:.35}
.mcal .dc.td{outline:2px solid var(--gold)}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;opacity:.45;filter:grayscale(1)}
.ach.ok{opacity:1;filter:none;outline:2px solid var(--gold)}
.ach .i{font-size:24px}

/* app themes */
html[data-theme="night"]{--bg:#0b1220;--card:#151f33;--text:#eef2f8;--hint:#8b98ad;--link:#d4af37}
html[data-theme="emerald"]{--bg:#06261e;--card:#0d372b;--text:#eafaf3;--hint:#8fbcac;--link:#e2c45c;--gold:#e2c45c;--gold-soft:rgba(226,196,92,.16);--green:#34d399;--line:rgba(160,220,200,.14)}
html[data-theme="sand"]{--bg:#f6efe3;--card:#fffaf1;--text:#2c2416;--hint:#8c7d63;--link:#9a6b00;--gold:#c08a14;--gold-soft:rgba(192,138,20,.14);--line:rgba(80,60,20,.14)}
html[data-theme="azure"]{--bg:#edf4ff;--card:#ffffff;--text:#0f2240;--hint:#6b7c99;--link:#2f6fe4;--gold:#2f7cf6;--gold-soft:rgba(47,124,246,.12);--on-gold:#ffffff;--line:rgba(30,60,120,.12)}

/* place picker */
.pmap{height:46vh;border-radius:18px;overflow:hidden;margin:10px 0;background:var(--card)}
.top .place{cursor:pointer}
.top .place::after{content:" ✏️";font-size:13px;opacity:.7}

/* qibla themes */
.compass.t-minimal .marker{border-top-color:var(--text)}
.compass.t-minimal .hub{background:var(--text)}
.compass.t-kaaba .hub{display:none}
.compass.t-night .marker{border-top-color:#39ff88;filter:drop-shadow(0 0 6px #39ff88)}
.compass.t-night .hub{background:#39ff88;box-shadow:0 0 12px #39ff88}
.compass.t-night .glow{box-shadow:0 0 30px rgba(77,225,255,.25)}
.center-chips{justify-content:center}

/* tasbih */
.dchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dchips::-webkit-scrollbar{display:none}
.dchips .chip{flex:none;white-space:nowrap}
.ringc,.beadsc{position:relative;display:block;width:min(72vw,260px);aspect-ratio:1;margin:16px auto;border-radius:50%}
.ringc svg,.beadsc svg{width:100%;height:100%}
.ringc .rb{fill:none;stroke:var(--line);stroke-width:14}
.ringc .rf{fill:none;stroke:var(--gold);stroke-width:14;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .2s}
.beadsc circle{fill:var(--line);transition:fill .15s}
.beadsc circle.on{fill:var(--gold)}
.ringc .in,.beadsc .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc .n,.beadsc .n{font-size:60px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ringc .g,.beadsc .g{color:var(--hint);font-weight:700}
.ringc:active,.beadsc:active{transform:scale(.97)}
#dCustomIn{text-align:center}

/* admin */
.adgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adgrid .card{margin:0}
.adgrid b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.adseg{overflow-x:auto}
.adseg button{flex:none;padding:9px 12px}
.chart{width:100%;height:110px;margin-top:10px;display:block}
.donut{display:flex;gap:14px;align-items:center;margin-top:8px}
.donut svg{width:120px;height:120px;flex:none}
.donut > div{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span:first-of-type{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb div{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.hb i{display:block;height:100%;background:var(--gold);border-radius:99px}
.plist .p{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px 4px;border-bottom:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.av.big{width:72px;height:72px;font-size:30px;margin:0 auto}
.plist .nm{flex:1;min-width:0}
.plist .nm b,.plist .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;margin:2px}

/* ═════════ Liquid Glass ═════════ */
:root{--sky1:#0b1a3a;--sky2:#1c1446;--sky3:#3b2f7a;--stars:0;
  --glass-a:58%;--glass:color-mix(in srgb,var(--card) var(--glass-a),transparent);
  --glass-edge:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.10);--glass-shadow:0 10px 30px rgba(0,0,0,.22)}
html.light{--glass-a:62%;--glass-edge:rgba(255,255,255,.7);--glass-hi:rgba(255,255,255,.45);--glass-shadow:0 10px 30px rgba(40,60,100,.12)}
html[data-sky=dawn]{--sky1:#2b2f6b;--sky2:#c26a7a;--sky3:#f0a868;--stars:.25}
html[data-sky=morning]{--sky1:#4a90d9;--sky2:#7fbde8;--sky3:#f2c46b;--stars:0}
html[data-sky=day]{--sky1:#2f7fd6;--sky2:#5aa5e6;--sky3:#7cc0f2;--stars:0}
html[data-sky=afternoon]{--sky1:#4f86c6;--sky2:#e8c27a;--sky3:#f4a340;--stars:0}
html[data-sky=sunset]{--sky1:#3a2a6a;--sky2:#e2665a;--sky3:#f6a04d;--stars:.15}
html[data-sky=dusk]{--sky1:#1d2350;--sky2:#6a3b7a;--sky3:#c0587a;--stars:.6}
html[data-sky=night]{--sky1:#0b1a3a;--sky2:#1c1446;--sky3:#3b2f7a;--stars:1}
html[data-sky=off]{--sky1:var(--gold);--sky2:var(--green);--sky3:var(--gold);--stars:0}
#sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
#sky .g{position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--sky1) 52%,var(--bg)) 0%,color-mix(in srgb,var(--sky2) 42%,var(--bg)) 45%,var(--bg) 85%);transition:background 2s}
html.light #sky .g{background:linear-gradient(180deg,color-mix(in srgb,var(--sky1) 42%,var(--bg)) 0%,color-mix(in srgb,var(--sky2) 30%,var(--bg)) 45%,var(--bg) 85%)}
html[data-sky=off] #sky .g{background:var(--bg)}
#sky .b{position:absolute;border-radius:50%;filter:blur(50px);opacity:.42;will-change:transform}
#sky .b1{width:70vw;height:70vw;max-width:420px;max-height:420px;left:-18vw;top:-10vh;background:var(--sky3);animation:fl1 22s ease-in-out infinite alternate}
#sky .b2{width:60vw;height:60vw;max-width:380px;max-height:380px;right:-20vw;top:18vh;background:var(--sky2);animation:fl2 26s ease-in-out infinite alternate}
#sky .b3{width:55vw;height:55vw;max-width:340px;max-height:340px;left:10vw;bottom:-12vh;background:var(--gold);opacity:.22;animation:fl3 30s ease-in-out infinite alternate}
html.light #sky .b{opacity:.35}
#sky .st{position:absolute;inset:0 0 40% 0;opacity:var(--stars);transition:opacity 2s;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 26%,#fff,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 30%,#fff,transparent),radial-gradient(1px 1px at 90% 6%,#fff,transparent),radial-gradient(1px 1px at 6% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 54% 44%,#fff,transparent),radial-gradient(1px 1px at 36% 52%,#fff,transparent),radial-gradient(1px 1px at 86% 50%,#fff,transparent);animation:tw 6s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(14vw,8vh) scale(1.1)}}
@keyframes fl2{to{transform:translate(-12vw,10vh) scale(.92)}}
@keyframes fl3{to{transform:translate(10vw,-8vh) scale(1.08)}}
@keyframes tw{to{filter:brightness(.6)}}
html,body{background:transparent}
html{background:var(--bg)}
.card,.menu .item,.btn.ghost,.calnav button,.search,.seg,.names .nm,.zk,.ach,.sheet .box{
  background:linear-gradient(135deg,var(--glass-hi),transparent 42%),var(--glass)!important;
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),var(--glass-shadow)}

.btn,.chip,.menu .item,nav button,.calnav button,.times .t,.sw,.c,.pm{transition:transform .15s ease}
.btn:active,.chip:active,.menu .item:active,nav button:active,.calnav button:active,.times .t:active{transform:scale(.96)}
nav{left:12px;right:12px;bottom:calc(8px + var(--safe-bottom));padding:6px;border-radius:26px;border:1px solid var(--glass-edge);
  background:linear-gradient(135deg,var(--glass-hi),transparent 50%),color-mix(in srgb,var(--card) 55%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-edge),0 12px 34px rgba(0,0,0,.28);max-width:560px;margin:0 auto}

/* lite: same look without live blur (slow phones, reduced transparency) */
html.lite .card,html.lite .menu .item,html.lite .btn.ghost,html.lite .calnav button,html.lite .search,html.lite .seg,html.lite .names .nm,html.lite .zk,html.lite .ach,html.lite nav,html.lite .sheet .box{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html.lite{--glass-a:90%}
html.lite #sky .b{animation:none;filter:blur(60px)}
@media (prefers-reduced-motion:reduce){#sky .b,#sky .st{animation:none}}
@media (prefers-reduced-transparency:reduce){html{--glass-a:94%}}

/* ───────── time helpers (the city's time zone, not the phone's) ───────── */
function tzOffset(at) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"}).formatToParts(at).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - at.getTime();
}
function wall(iso, hhmm) {  // "2026-11-16" + "05:36" in TZ -> epoch ms
  const [y, m, d] = iso.split("-").map(Number), [h, mi] = hhmm.split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  return guess - tzOffset(new Date(guess));
}
function todayISO() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dmyToIso = s => { const [d, m, y] = s.split("-"); return `${y}-${m}-${d}`; };
const pad = n => String(n).padStart(2, "0");
function fmtLeft(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; }

/* ───────── storage: Telegram cloud, local fallback ───────── */
const store = {
  cloud: () => ver("6.9") && tg.CloudStorage,
  get(keys) {
    return new Promise(res => {
      const local = () => { const o = {}; keys.forEach(k => { try { o[k] = localStorage.getItem(k) || ""; } catch (e) { o[k] = ""; } }); res(o); };
      if (!this.cloud()) return local();
      try { tg.CloudStorage.getItems(keys, (err, vals) => err ? local() : res(vals || {})); } catch (e) { local(); }
    });
  },
  set(k, v) {
    try { localStorage.setItem(k, v); } catch (e) {}
    if (this.cloud()) try { tg.CloudStorage.setItem(k, v); } catch (e) {}
  }
};

function eventsAround() {
  const iso = DATA.today.date, t = DATA.today.t, tm = DATA.tomorrow.t;
  const list = FARD.map(k => ({k, at: wall(iso, t[k])}));
  list.unshift({k: "Isha", at: wall(addDays(iso, -1), t.Isha), prev: true});
  list.push({k: "Fajr", at: wall(addDays(iso, 1), tm.Fajr), next: true});
  return list;
}
function renderToday() {
  const t = DATA.today.t, p = DATA.profile;
  $("place").textContent = "📍 " + p.city;
  const [y, m, d] = DATA.today.date.split("-").map(Number);
  $("dates").textContent = `${d} ${T.gm[m - 1]} ${y}`;
  $("hijriPill").textContent = `🗓 ${DATA.today.hday} ${T.hm[DATA.today.hmonth - 1]} ${DATA.today.hyear}`;
  $("times").innerHTML = PRAYERS.map(k => `<div class="t" data-k="${k}"><div class="ico">${ICONS[k]}</div><div class="nm">${esc(T.pn[k])}</div><div class="tm">${t[k]}</div></div>`).join("");
  tick(); renderShare(); loadCommunity(); renderExtra(); updateSky(true);
}
function tick() {
  if (!DATA || DATA.need_setup) return;
  if (todayISO() !== DATA.today.date) { load(true); return; }  // new day in the city
  updateSky();
  const now = Date.now(), ev = eventsAround();
  let i = ev.findIndex(e => e.at > now); if (i < 1) i = 1;
  const prev = ev[i - 1], next = ev[i];
  const total = next.at - prev.at, left = next.at - now;
  const C = 2 * Math.PI * 104, ring = $("ring");
  ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C * (left / total);
  $("untilLbl").textContent = tr("next_l");
  $("nextName").textContent = T.pn[next.k];
  $("left").textContent = fmtLeft(left);
  $("nextAt").textContent = tr("at", {t: next.next ? DATA.tomorrow.t.Fajr : DATA.today.t[next.k]});
  const t = DATA.today.t, iso = DATA.today.date;
  document.querySelectorAll("#times .t").forEach(row => {
    const k = row.dataset.k, at = wall(iso, t[k]);
    row.classList.toggle("past", at <= now && !(prev.k === k && !prev.prev));
    const fajrOver = prev.k === "Fajr" && now >= wall(iso, t.Sunrise);
    row.classList.toggle("now", !prev.prev && prev.k === k && !fajrOver);
    row.classList.toggle("next", !next.next && next.k === k);
  });
}

function bearing(lat, lon) {
  const r = Math.PI / 180, p1 = lat * r, p2 = KAABA[0] * r, dl = (KAABA[1] - lon) * r;
  const y = Math.sin(dl) * Math.cos(p2), x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
function distanceKm(lat, lon, lat2 = KAABA[0], lon2 = KAABA[1]) {
  const r = Math.PI / 180, dLa = (lat2 - lat) * r, dLo = (lon2 - lon) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(lat * r) * Math.cos(lat2 * r) * Math.sin(dLo / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
/* One heading source only (mixing iPhone's compass with Telegram's made the dial jump between two values),
   and a single animation loop that eases the dial towards the latest reading. */
let compassOn = false, target = null, shown = null, lastOk = false, gotEvent = false, SOURCE = null, rafOn = false, lastStatus = "";
const PRIORITY = {ios: 3, abs: 2, tg: 1};
function onHeading(h, src) {
  if (h == null || isNaN(h)) return;
  if (SOURCE && PRIORITY[src] < PRIORITY[SOURCE]) return;   // a better source already works
  if (SOURCE !== src) { SOURCE = src; shown = null; }
  gotEvent = true;
  target = ((h % 360) + 360) % 360;
  $("qEnableWrap").hidden = true;
  if (!rafOn) { rafOn = true; requestAnimationFrame(frame); }
}
function frame() {
  if (target == null || TAB !== "qibla") { rafOn = false; return; }
  if (shown == null) shown = target;
  const d = ((target - shown + 540) % 360) - 180;           // shortest way round
  shown = Math.abs(d) < 0.05 ? target : (shown + d * 0.18 + 360) % 360;
  $("dial").style.transform = `rotate(${(-shown).toFixed(2)}deg)`;
  const diff = Math.abs(((QIBLA - shown + 540) % 360) - 180), ok = diff < 5;
  const status = ok ? tr("q_ok") : `${Math.round(diff)}°`;
  if (status !== lastStatus) { $("qStatus").textContent = status; lastStatus = status; }
  if (ok !== lastOk) {
    $("compass").classList.toggle("ok", ok); $("qStatus").classList.toggle("ok", ok);
    if (ok) { try { tg?.HapticFeedback?.notificationOccurred("success"); } catch (e) {} }
    lastOk = ok;
  }
  requestAnimationFrame(frame);
}
function screenAngle() { return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function listenBrowser() {
  window.addEventListener("deviceorientationabsolute", e => { if (e.alpha != null) onHeading(360 - e.alpha + screenAngle(), "abs"); }, true);
  window.addEventListener("deviceorientation", e => {
    if (e.webkitCompassHeading != null && e.webkitCompassHeading >= 0) onHeading(e.webkitCompassHeading + screenAngle(), "ios");
    else if (e.absolute && e.alpha != null) onHeading(360 - e.alpha + screenAngle(), "abs");
  }, true);
}
function listenTelegram() {
  if (!ver("8.0") || !tg.DeviceOrientation) return;
  // Telegram's sensor is only a fallback: used if the phone's own compass sends nothing within 1.5 s.
  setTimeout(() => {
    if (gotEvent) return;
    try {
      tg.onEvent("deviceOrientationChanged", () => {
        const a = tg.DeviceOrientation.alpha;
        if (a != null && tg.DeviceOrientation.absolute) onHeading(360 - a * 180 / Math.PI, "tg");
      });
      tg.DeviceOrientation.start({refresh_rate: 50, need_absolute: true});
    } catch (e) {}
  }, 1500);
}
function startCompass() {
  if (compassOn) return;
  const needPerm = typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function";
  const begin = () => {
    compassOn = true; listenBrowser(); listenTelegram();
    setTimeout(() => { if (!gotEvent) { $("qStatus").textContent = ""; $("qHint").textContent = tr("q_nocompass", {deg: Math.round(QIBLA)}); $("dial").style.transform = "rotate(0deg)"; } }, 2500);
  };
  if (needPerm) {
    $("qEnableWrap").hidden = false;
    $("qEnable").onclick = () => DeviceOrientationEvent.requestPermission().then(s => { if (s === "granted") begin(); }).catch(begin);
  } else { $("qEnableWrap").hidden = true; begin(); }
}

let CAL = null;
async function renderCal(y, m) {
  if (y == null) { CAL = DATA.month; } else {
    $("calTbl").innerHTML = `<tr><td class="muted" style="padding:20px">${tr("loading")}</td></tr>`;
    try { const r = await api(`/api/month?y=${y}&m=${m}`); CAL = {y: r.y, m: r.m, days: r.days}; } catch (e) { $("calTbl").innerHTML = `<tr><td class="muted" style="padding:20px">${tr("err")}</td></tr>`; return; }
  }
  const today = todayISO(), d0 = CAL.days[0], dl = CAL.days[CAL.days.length - 1];
  $("calTitle").textContent = `${T.gm[CAL.m - 1]} ${CAL.y}`;
  $("calSub").textContent = d0.hmonth === dl.hmonth ? `${T.hm[d0.hmonth - 1]} ${d0.hyear}` : `${T.hm[d0.hmonth - 1]} – ${T.hm[dl.hmonth - 1]} ${dl.hyear}`;
  const head = `<tr><th></th>${PRAYERS.map(k => `<th>${ICONS[k]}<br>${esc(T.pn[k])}</th>`).join("")}</tr>`;
  const wdIdx = {Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6};
  const rows = CAL.days.map(d => {
    const iso = dmyToIso(d.date), cls = [iso === today ? "today" : "", d.wd === "Fri" ? "fri" : ""].join(" ");
    return `<tr class="${cls}" ${iso === today ? 'id="calToday"' : ""}><td><b>${d.day}</b> ${T.wd[wdIdx[d.wd]]}<span class="h">${d.hday} ${esc(T.hm[d.hmonth - 1])}</span></td>${PRAYERS.map(k => `<td>${d.t[k]}</td>`).join("")}</tr>`;
  }).join("");
  $("calTbl").innerHTML = head + rows;
  const el = $("calToday"); if (el) el.scrollIntoView({block: "center"});
}
function shiftMonth(n) { let y = CAL.y, m = CAL.m + n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } haptic(); renderCal(y, m); }

const trKey = iso => "tr_" + iso.replace(/-/g, "");
let TRK = {};
async function renderTracker() {
  $("trTitle").textContent = tr("m_tracker"); $("trHint").textContent = tr("tr_hint");
  $("trStreakL").textContent = tr("tr_streak"); $("trWeekL").textContent = tr("tr_week"); $("trChBtn").textContent = "🤝 " + tr("m_ch");
  await loadTrackerDays(124);
  drawTracker();
}
function drawTracker() {
  const today = todayISO(), v = TRK[today] || "00000";
  $("trChecks").innerHTML = FARD.map((k, i) => `<button class="c ${v[i] === "1" ? "on" : ""}" data-i="${i}"><div class="box">${v[i] === "1" ? "✓" : ""}</div><div class="nm">${ICONS[k]} ${esc(T.pn[k])}</div><div class="muted">${DATA.today.t[k]}</div></button>`).join("");
  const count = iso => (TRK[iso] || "").split("").filter(x => x === "1").length;
  let streak = 0; for (let i = (count(today) === 5 ? 0 : 1); i < 60; i++) { if (count(addDays(today, -i)) === 5) streak++; else break; }
  $("trStreak").textContent = streak;
  const week = Array.from({length: 7}, (_, i) => addDays(today, i - 6));
  $("trWeekN").textContent = `${week.reduce((s, d) => s + count(d), 0)} / 35`;
  setTimeout(drawTrackerStats, 0);
  $("trWeek").innerHTML = week.map(d => { const n = count(d), wd = (new Date(d + "T12:00:00Z").getUTCDay() + 6) % 7; return `<div class="d"><div class="lb">${n}</div><div class="bar ${n === 5 ? "full" : ""}" style="height:${Math.max(4, n * 18)}px"></div><div class="lb">${T.wd[wd]}</div></div>`; }).join("");
}
function toggleTrack(i) {
  const today = todayISO(), v = (TRK[today] || "00000").split("");
  v[i] = v[i] === "1" ? "0" : "1"; TRK[today] = v.join("");
  store.set(trKey(today), TRK[today]);
  if (TR_SERVER) apiPost("/api/tracker", {day: today, mask: TRK[today]}).catch(() => toast(tr("st_err")));
  TRS.total = Math.max(0, (TRS.total || 0) + (v[i] === "1" ? 1 : -1));
  setTimeout(() => store.set("tr_stats", JSON.stringify(TRS)), 50);
  if (TRK[today] === "11111") { try { tg?.HapticFeedback?.notificationOccurred("success"); } catch (e) {} } else haptic();
  drawTracker();
}

let RAM = null, ramTimer = null;
async function renderRamadan() {
  $("rTbl").innerHTML = `<tr><td class="muted" style="padding:20px">${tr("loading")}</td></tr>`;
  $("rTitle").textContent = tr("m_ramadan"); $("rSub").textContent = ""; $("rCount").textContent = ""; $("rCountL").textContent = "";
  try { RAM = RAM || await api("/api/ramadan"); } catch (e) { $("rTbl").innerHTML = `<tr><td class="muted" style="padding:20px">${tr("err")}</td></tr>`; return; }
  $("rTitle").textContent = tr("r_title", {y: RAM.hyear});
  const today = todayISO(), first = dmyToIso(RAM.days[0].date), last = dmyToIso(RAM.days[RAM.days.length - 1].date);
  $("rTbl").innerHTML = `<tr><th>${tr("r_day")}</th><th></th><th>🥣 ${tr("r_s")}</th><th>🍽 ${tr("r_i")}</th></tr>` + RAM.days.map(d => {
    const iso = dmyToIso(d.date), [y, m, dd] = iso.split("-").map(Number);
    return `<tr class="${iso === today ? "today" : ""}" ${iso === today ? 'id="ramToday"' : ""}><td><b>${d.hday}</b></td><td>${dd} ${T.gm[m - 1].slice(0, 3)}</td><td>${d.t.Fajr}</td><td>${d.t.Maghrib}</td></tr>`;
  }).join("");
  const el = $("ramToday"); if (el) el.scrollIntoView({block: "center"});
  clearInterval(ramTimer);
  const upd = () => {
    if (today < first) {
      const n = Math.round((new Date(first + "T12:00:00Z") - new Date(today + "T12:00:00Z")) / 864e5);
      $("rCountL").textContent = tr("r_in"); $("rCount").textContent = tr("r_days", {n}); $("rSub").textContent = "";
    } else if (today <= last) {
      $("rSub").textContent = tr("r_mub");
      const day = RAM.days.find(d => dmyToIso(d.date) === today), now = Date.now();
      const fajr = wall(today, day.t.Fajr), mag = wall(today, day.t.Maghrib);
      if (now < fajr) { $("rCountL").textContent = tr("r_suhoor"); $("rCount").textContent = fmtLeft(fajr - now); }
      else if (now < mag) { $("rCountL").textContent = tr("r_iftar"); $("rCount").textContent = fmtLeft(mag - now); }
      else { $("rCountL").textContent = ""; $("rCount").textContent = "🤍"; $("rSub").textContent = tr("r_over"); }
    } else { $("rCountL").textContent = ""; $("rCount").textContent = "🌙"; }
  };
  upd(); ramTimer = setInterval(() => { if (SUB === "ramadan") upd(); }, 1000);
}

let leafletReady = null, MAP = null, MLAYER = null;
function loadLeaflet() {
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((ok, bad) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; js.onload = ok; js.onerror = bad; document.head.appendChild(js);
  });
  return leafletReady;
}
async function openMosques() {
  const p = DATA.profile;
  $("moTitle").textContent = tr("m_mosques"); $("moNear").textContent = tr("mo_near");
  $("moSub").textContent = tr("mo_city", {c: p.city});
  await findMosques(p.lat, p.lon);
}
async function findMosques(lat, lon) {
  $("moList").innerHTML = `<div class="muted">${tr("mo_load")}</div>`;
  try {
    await loadLeaflet();
    if (!MAP) {
      MAP = L_.map("map", {zoomControl: false, attributionControl: true});
      L_.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(MAP);
      MLAYER = L_.layerGroup().addTo(MAP);
    }
    MAP.setView([lat, lon], 14); MLAYER.clearLayers();
    L_.circleMarker([lat, lon], {radius: 8, color: "#fff", weight: 3, fillColor: "#3b82f6", fillOpacity: 1}).addTo(MLAYER);
    setTimeout(() => MAP.invalidateSize(), 200);
    const j = await api(`/api/mosques?lat=${lat}&lon=${lon}`);
    const list = (j.items || []).map(e => ({la: e.lat, lo: e.lon, name: (e.names && e.names[LANG]) || e.name || tr("mo_noname"), d: distanceKm(lat, lon, e.lat, e.lon)}))
      .sort((a, b) => a.d - b.d).slice(0, 60);
    if (!list.length) { $("moList").innerHTML = `<div class="muted">${tr("mo_none")}</div>`; return; }
    const icon = L_.divIcon({html: '<div style="font-size:24px;line-height:24px">🕌</div>', className: "", iconSize: [24, 24], iconAnchor: [12, 12]});
    list.forEach((m, i) => { m.mk = L_.marker([m.la, m.lo], {icon}).addTo(MLAYER).bindPopup(esc(m.name)); });
    MAP.fitBounds(L_.latLngBounds([[lat, lon], ...list.slice(0, 8).map(m => [m.la, m.lo])]), {padding: [30, 30]});
    $("moList").innerHTML = list.map((m, i) => `<div class="m"><div style="font-size:22px">🕌</div><div class="nm"><b data-i="${i}">${esc(m.name)}</b><span class="muted">${m.d < 1 ? Math.round(m.d * 1000) + " " + tr("mt") : m.d.toFixed(1) + " " + tr("km")}</span></div><button class="go" data-la="${m.la}" data-lo="${m.lo}">${tr("mo_route")} ›</button></div>`).join("");
    $("moList").querySelectorAll("b[data-i]").forEach(b => b.onclick = () => { const m = list[+b.dataset.i]; MAP.setView([m.la, m.lo], 16); m.mk.openPopup(); window.scrollTo({top: 0, behavior: "smooth"}); });
    $("moList").querySelectorAll("button.go").forEach(b => b.onclick = () => openLink(`https://www.google.com/maps/dir/?api=1&destination=${b.dataset.la},${b.dataset.lo}`));
  } catch (e) { $("moList").innerHTML = `<div class="muted">${tr("mo_err")}</div>`; }
}

 {id:"kursi",w:"b",n:1,ar:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",

 {id:"quls",w:"b",n:3,ar:"قُلْ هُوَ اللَّهُ أَحَدٌ • اللَّهُ الصَّمَدُ • لَمْ يَلِدْ وَلَمْ يُولَدْ • وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ • مِن شَرِّ مَا خَلَقَ • وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ • وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ • وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ • مَلِكِ النَّاسِ • إِلَٰهِ النَّاسِ • مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ • الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ • مِنَ الْجِنَّةِ وَالنَّاسِ",

 {id:"bika_m",w:"m",n:1,ar:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",tl:"Allahumma bika asbahna, wa bika amsayna, wa bika nahya, wa bika namutu, wa ilaykan-nushur",
  m:{en:"O Allah, by You we enter the morning and by You we enter the evening; by You we live and by You we die, and to You is the resurrection.",ru:"О Аллах, благодаря Тебе мы встретили утро и благодаря Тебе встречаем вечер, благодаря Тебе живём и умираем, и к Тебе — воскрешение.",uz:"Allohim, Sen bilan tong ottirdik va Sen bilan kech kirgizamiz, Sen bilan yashaymiz va Sen bilan o'lamiz, qayta tirilish ham Sengadir.",tg:"Худоё, ба Ту субҳ кардем ва ба Ту шом мекунем, ба Ту зиндагӣ мекунем ва ба Ту мемирем ва барангехтан ба сӯи Туст."},s:["tirmidhi"]},
 {id:"bika_e",w:"e",n:1,ar:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",tl:"Allahumma bika amsayna, wa bika asbahna, wa bika nahya, wa bika namutu, wa ilaykal-masir",

 {id:"sayyid",w:"b",n:1,ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",
  tl:"Allahumma anta rabbi, la ilaha illa ant, khalaqtani wa ana 'abduk, wa ana 'ala 'ahdika wa wa'dika mastata't, a'udhu bika min sharri ma sana't, abu'u laka bini'matika 'alayya, wa abu'u bidhanbi, faghfir li, fa innahu la yaghfirudh-dhunuba illa ant",
  m:{en:"O Allah, You are my Lord, there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as much as I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.",ru:"О Аллах, Ты — мой Господь, нет божества, кроме Тебя. Ты сотворил меня, а я — Твой раб, и я храню верность договору с Тобой и обещанию Тебе, насколько могу. Прибегаю к Тебе от зла того, что я совершил. Признаю милость Твою ко мне и признаю свой грех. Прости же меня, ведь никто не прощает грехи, кроме Тебя.",uz:"Allohim, Sen mening Robbimsan, Sendan o'zga iloh yo'q. Sen meni yaratding, men Sening bandangman. Qodir bo'lganimcha Senga bergan ahdim va va'dam ustidaman. Qilgan ishlarimning yomonligidan Senga panoh so'rayman. Menga bergan ne'matingni e'tirof etaman va gunohimni ham e'tirof etaman. Meni kechir, chunki gunohlarni Sendan boshqa hech kim kechirmaydi.",tg:"Худоё, Ту Парвардигори манӣ, ҷуз Ту маъбуде нест. Маро офаридӣ ва ман бандаи Тую. Ба аҳду ваъдаи Ту то ҷое ки тавонам, устуворам. Аз шарри он чи кардаам, ба Ту паноҳ мебарам. Ба неъмати Ту бар худ иқрор мекунам ва ба гуноҳи худ иқрор мекунам, пас маро биомурз, зеро ҷуз Ту касе гуноҳҳоро намеомурзад."},s:["bukhari"]},
 {id:"bismillah",w:"b",n:3,ar:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",tl:"Bismillahil-ladhi la yadurru ma'asmihi shay'un fil-ardi wa la fis-sama'i wa huwas-sami'ul-'alim",
  m:{en:"In the name of Allah, with whose name nothing on earth or in heaven can cause harm, and He is the All-Hearing, the All-Knowing.",ru:"С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе, и Он — Слышащий, Знающий.",uz:"Ismi bilan yerda ham, osmonda ham hech narsa zarar yetkaza olmaydigan Allohning ismi bilan. U eshituvchi va biluvchidir.",tg:"Ба номи Аллоҳ, ки бо номи Ӯ ҳеҷ чиз дар замин ва дар осмон зарар намерасонад, ва Ӯ Шунавою Доност."},s:["abudawud","tirmidhi"]},
 {id:"raditu",w:"b",n:3,ar:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",tl:"Raditu billahi rabba, wa bil-Islami dina, wa bi Muhammadin sallallahu 'alayhi wa sallama nabiyya",
  m:{en:"I am pleased with Allah as my Lord, with Islam as my religion and with Muhammad ﷺ as my Prophet.",ru:"Я доволен Аллахом как Господом, исламом как религией и Мухаммадом ﷺ как пророком.",uz:"Allohni Robb, Islomni din va Muhammad ﷺni payg'ambar deb rozi bo'ldim.",tg:"Ба Аллоҳ ҳамчун Парвардигор, ба Ислом ҳамчун дин ва ба Муҳаммад ﷺ ҳамчун паёмбар розӣ шудам."},s:["abudawud","tirmidhi"]},
 {id:"hasbi",w:"b",n:7,ar:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",tl:"Hasbiyallahu la ilaha illa huwa, 'alayhi tawakkaltu, wa huwa rabbul-'arshil-'azim",
  m:{en:"Allah is sufficient for me; there is no god but Him. In Him I put my trust, and He is the Lord of the Mighty Throne.",ru:"Достаточно мне Аллаха, нет божества, кроме Него. На Него я уповаю, и Он — Господь великого Трона.",uz:"Menga Alloh kifoya, Undan o'zga iloh yo'q. Unga tavakkul qildim va U ulug' Arshning Robbidir.",tg:"Аллоҳ маро басанда аст, ҷуз Ӯ маъбуде нест. Бар Ӯ таваккал кардам ва Ӯ Парвардигори Арши бузург аст."},s:["abudawud"]},
 {id:"hayy",w:"b",n:1,ar:"يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ",tl:"Ya Hayyu ya Qayyum, bi rahmatika astaghith, aslih li sha'ni kullahu, wa la takilni ila nafsi tarfata 'ayn",

/* ───────── toast & POST ───────── */
let toastT = null;
function toast(text) {
  let el = $("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = text; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 1600);
}
async function apiPost(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"X-Init-Data": tg?.initData || "", "Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* ───────── SETTINGS ───────── */
function chips(el, opts, cur, onPick) {
  el.innerHTML = opts.map(([v, label]) => `<button class="chip ${String(v) === String(cur) ? "on" : ""}" data-v="${esc(v)}">${esc(label)}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { haptic(); onPick(b.dataset.v); });
}
function sw(el, label, on, onToggle) {
  el.className = "sw" + (on ? " on" : ""); el.innerHTML = `<span>${esc(label)}</span><span class="tg"></span>`;
  el.onclick = () => { haptic(); onToggle(!el.classList.contains("on")); };
}
async function saveSetting(patch) {
  try {
    const r = await apiPost("/api/settings", patch);
    DATA.profile = Object.assign(DATA.profile, r.profile);
    toast(tr("st_saved"));
    if (patch.lang) { LANG = patch.lang; applyLang(); renderToday(); renderQibla(); renderMore(); }
    if (patch.madhab) { await load(true); }
    if ("fast_show" in patch) renderExtra();
    renderSettings();
  } catch (e) { toast(tr("st_err")); renderSettings(); }
}
function renderSettings() {
  const p = DATA.profile;
  $("stTitle").textContent = tr("m_settings"); $("stCityL").textContent = tr("st_city"); $("stCity").textContent = "📍 " + p.city;
  $("stCityChange").textContent = tr("pl_change"); renderThemePicker();
  $("stLangL").textContent = tr("st_lang"); $("stMadhabL").textContent = tr("st_madhab");
  $("stLeadL").textContent = tr("st_lead"); $("stAutoL").textContent = tr("st_auto"); $("stQuietL").textContent = tr("st_quiet");
  const uzb = LANG === "uz" || LANG === "uzc";
  chips($("stLang"), [["en", "🇬🇧 English"], ["ru", "🇷🇺 Русский"], ["uzb", "🇺🇿 Oʻzbekcha / Ўзбекча"], ["tg", "🇹🇯 Тоҷикӣ"], ["ar", "🇸🇦 العربية"]],
    uzb ? "uzb" : LANG, v => { if (v === "uzb") { if (!uzb) saveSetting({lang: "uz"}); } else saveSetting({lang: v}); });
  $("stScript").hidden = !uzb;
  if (uzb) chips($("stScript"), [["uz", "🔤 Lotin"], ["uzc", "🔤 Кирилл"]], LANG, v => { if (v !== LANG) saveSetting({lang: v}); });
  chips($("stMadhab"), [["std", tr("st_std")], ["hanafi", tr("st_hanafi")]], p.madhab, v => saveSetting({madhab: v}));
  sw($("stRemind"), tr("st_remind"), p.remind, v => saveSetting({remind: v}));
  chips($("stLead"), (p.lead_options || [5, 10, 15, 30, 0]).map(n => [n, n ? tr("st_min", {n}) : tr("st_lead_off")]), p.lead, v => saveSetting({lead: +v}));
  sw($("stAt"), tr("st_at"), p.at_time, v => saveSetting({at_time: v}));
  chips($("stAuto"), (p.auto_options || [0, 1, 5, 15]).map(n => [n, !n ? tr("st_auto_off") : n === 1 ? tr("st_auto_1") : tr("st_min", {n})]), p.auto, v => saveSetting({auto: +v}));
  chips($("stQuiet"), (p.quiet_options || ["off"]).map(q => [q, q === "off" ? tr("st_quiet_off") : q.split("-").map(h => pad(h) + ":00").join("–")]), p.quiet, v => saveSetting({quiet: v}));
  sw($("stRam"), tr("st_ram"), p.ramadan, v => saveSetting({ramadan: v}));
  sw($("stWk"), tr("st_wk"), p.weekly !== false, v => saveSetting({weekly: v}));
  const az = p.azan_options || [];
  $("stAzanCard").hidden = !az.length;
  if (az.length) {
    $("stAzanL").textContent = tr("st_azan"); $("stAzanH").textContent = tr("st_azan_h");

const HFMT = (() => { try { return new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {day: "numeric", month: "numeric", year: "numeric", timeZone: "UTC"}); } catch (e) { return null; } })();
function hij(iso) {  // Intl's Hijri date of a Gregorian day
  const p = Object.fromEntries(HFMT.formatToParts(new Date(iso + "T12:00:00Z")).map(x => [x.type, x.value]));
  return {d: +p.day, m: +p.month, y: parseInt(p.year, 10)};
}
let HSHIFT = null;  // days between Intl's calendar and the bot's (Aladhan) calendar
function hShift() {
  if (HSHIFT != null) return HSHIFT;
  HSHIFT = 0;
  if (!HFMT) return 0;
  const t = todayISO();
  for (const k of [0, 1, -1, 2, -2]) { const h = hij(addDays(t, k)); if (h.d === DATA.today.hday && h.m === DATA.today.hmonth) { HSHIFT = k; break; } }
  return HSHIFT;
}
const hijOf = iso => hij(addDays(iso, hShift()));                     // bot-aligned Hijri of a Gregorian day
function gregOf(d, m, y) {                                             // Gregorian day of a Hijri date, or null
  const t = todayISO(), now = DATA.today;
  const approx = Math.round((y - now.hyear) * 354.367 + (m - now.hmonth) * 29.53 + (d - now.hday));
  for (let i = 0; i <= 40; i++) for (const sgn of i ? [1, -1] : [1]) {
    const iso = addDays(t, approx + sgn * i), h = hijOf(iso);
    if (h.d === d && h.m === m && h.y === y) return iso;
  }
  return null;
}
const EVENTS = [["ev_ny", 1, 1, "🌙"], ["ev_ash", 10, 1, "🕊"], ["ev_ram", 1, 9, "🌙"], ["ev_qadr", 27, 9, "✨"], ["ev_fitr", 1, 10, "🎉"], ["ev_arafa", 9, 12, "⛰"], ["ev_adha", 10, 12, "🐑"]];
function fmtG(iso) { const [y, m, d] = iso.split("-").map(Number), wd = (new Date(iso + "T12:00:00Z").getUTCDay() + 6) % 7; return `${T.wd[wd]}, ${d} ${T.gm[m - 1]} ${y}`; }
function fmtH(h) { return `${h.d} ${T.hm[h.m - 1]} ${h.y}`; }
function renderDates() {

  $("dtToday").textContent = tr("dt_today", {d: fmtH({d: DATA.today.hday, m: DATA.today.hmonth, y: DATA.today.hyear})});
  const t = todayISO(), list = [];
  if (HFMT) for (const [key, d, m, ic] of EVENTS) {
    let y = DATA.today.hyear, iso = gregOf(d, m, y);
    if (!iso || iso < t) { y += 1; iso = gregOf(d, m, y); }
    if (iso) list.push({key, ic, iso, n: Math.round((new Date(iso + "T12:00:00Z") - new Date(t + "T12:00:00Z")) / 864e5), h: {d, m, y}});

/* ───────── TRACKER: month, totals, achievements ───────── */
let TRS = {total: null, best: 0}, TRM = null, TR_SERVER = false;
async function loadTrackerDays(n) {
  const today = todayISO(), days = Array.from({length: n}, (_, i) => addDays(today, -i)), out = {};
  for (let i = 0; i < days.length; i += 30) Object.assign(out, await store.get(days.slice(i, i + 30).map(trKey)));
  const st = (await store.get(["tr_stats", "tr_migrated"])); try { if (st.tr_stats) TRS = Object.assign(TRS, JSON.parse(st.tr_stats)); } catch (e) {}
  TRK = {}; days.forEach(d => TRK[d] = (out[trKey(d)] || "00000").padEnd(5, "0").slice(0, 5));
  try {
    if (st.tr_migrated !== "1") {  // one-time move of the old marks to the server
      const old = {}; days.forEach(d => { if (TRK[d] !== "00000") old[d] = TRK[d]; });
      await apiPost("/api/tracker_bulk", {days: old}); store.set("tr_migrated", "1");
    }
    const r = await api("/api/tracker?from=" + days[days.length - 1]);
    days.forEach(d => TRK[d] = r.days[d] || "00000");
    TRS.total = r.total; TR_SERVER = true;
  } catch (e) {
    TR_SERVER = false;
    if (TRS.total == null) TRS.total = days.reduce((s, d) => s + TRK[d].split("").filter(x => x === "1").length, 0);
  }
}
const dayCount = iso => (TRK[iso] || "").split("").filter(x => x === "1").length;
function currentStreak() { const t = todayISO(); let s = 0; for (let i = (dayCount(t) === 5 ? 0 : 1); i < 400; i++) { if (dayCount(addDays(t, -i)) === 5) s++; else break; } return s; }
function drawTrackerStats() {
  const streak = currentStreak(); TRS.best = Math.max(TRS.best || 0, streak);
  $("trBest").textContent = TRS.best; $("trTotal").textContent = (TRS.total || 0).toLocaleString();
  $("trBestL").textContent = tr("tr_best"); $("trTotalL").textContent = tr("tr_total"); $("trAchL").textContent = tr("tr_ach");
  if (!TRM) { const [y, m] = todayISO().split("-").map(Number); TRM = {y, m}; }
  const {y, m} = TRM, first = `${y}-${pad(m)}-01`, days = new Date(Date.UTC(y, m, 0)).getUTCDate(), today = todayISO();
  const lead = (new Date(first + "T12:00:00Z").getUTCDay() + 6) % 7;
  let done = 0, possible = 0, cells = T.wd.map(w => `<div class="hd">${esc(w)}</div>`).join("") + "<div></div>".repeat(lead);
  for (let d = 1; d <= days; d++) {
    const iso = `${y}-${pad(m)}-${pad(d)}`, n = iso in TRK ? dayCount(iso) : 0, future = iso > today;
    if (!future) { done += n; possible += 5; }
    cells += `<div class="dc ${future ? "fu" : ""} ${iso === today ? "td" : ""} ${n === 5 ? "full" : ""}" style="${n && n < 5 ? `background:rgba(212,175,55,${0.15 + n * 0.15})` : ""}">${d}</div>`;
  }
  $("trCal").innerHTML = cells;
  $("trMonthT").textContent = `${T.gm[m - 1]} ${y}`;
  $("trPct").textContent = possible ? tr("tr_pct", {p: Math.round(100 * done / possible)}) : "";
  const ach = [["🌱", tr("a_day"), TRS.best >= 1], ["🔥", tr("a_streak", {n: 3}), TRS.best >= 3], ["⭐", tr("a_streak", {n: 7}), TRS.best >= 7], ["🏅", tr("a_streak", {n: 30}), TRS.best >= 30],
    ["💯", tr("a_total", {n: 100}), TRS.total >= 100], ["🏆", tr("a_total", {n: 500}), TRS.total >= 500], ["👑", tr("a_total", {n: 1000}), TRS.total >= 1000]];
  $("trAch").innerHTML = ach.map(([ic, t1, ok]) => `<div class="ach ${ok ? "ok" : ""}"><div class="i">${ic}</div><div>${esc(t1)}</div></div>`).join("");
}
function shiftTrMonth(n) {
  let {y, m} = TRM; m += n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }

async function aiSend() {
  const text = $("aiIn").value.trim(); if (!text || $("aiSend").disabled) return;
  haptic(); $("aiIn").value = ""; $("aiIn").style.height = "";
  AI_LOG.push({me: true, text}); AI_LOG.push({typing: true, html: esc(tr("ai_typing"))}); aiDraw();
  window.scrollTo(0, document.body.scrollHeight);
  $("aiSend").disabled = true;
  try {
    const r = await apiPost("/api/ai", {text});
    AI_LOG.pop();
    if (r.ok) AI_LOG.push({html: r.html, disc: r.disc});
    else if (r.error === "limit") AI_LOG.push({buy: true, text: tr("ai_limit")});
    else AI_LOG.push({html: esc(tr("ai_err"))});
    if (r.status !== undefined) DATA.ai.status = r.status;
  } catch (e) { AI_LOG.pop(); AI_LOG.push({html: esc(tr("ai_err"))}); }
  $("aiSend").disabled = false; aiSub(); aiDraw();
  window.scrollTo(0, document.body.scrollHeight);
}

/* payments: Telegram Stars invoices opened inside the mini app */
async function payInvoice(body, okKey) {
  haptic();
  try {
    const r = await apiPost("/api/invoice", body);
    tg.openInvoice(r.link, async status => {
      if (status !== "paid") return;
      try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      toast(tr(okKey));
      try { const d = await api("/api/me"); DATA.ai = d.ai; if (SUB === "ai") { aiSub(); AI_LOG = AI_LOG.filter(m => !m.buy); aiDraw(); } } catch (e) {}
    });
  } catch (e) { toast(tr("st_err")); }
}

/* glass: lighter version for slow phones */
function detectLite() {
  const ua = navigator.userAgent || "";
  const m = ua.match(/Telegram-Android\/[^\s]+ \([^)]*;\s*(LOW|AVERAGE|HIGH)\)/i);
  const slow = (m && m[1].toUpperCase() !== "HIGH") || (/Android/i.test(ua) && ((navigator.deviceMemory || 8) <= 3 || (navigator.hardwareConcurrency || 8) <= 4));
  document.documentElement.classList.toggle("lite", !!slow || !CSS.supports("backdrop-filter", "blur(2px)") && !CSS.supports("-webkit-backdrop-filter", "blur(2px)"));
  const light = () => {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    const c = document.createElement("canvas").getContext("2d"); c.fillStyle = bg || "#000";
    const hex = c.fillStyle; if (!/^#/.test(hex)) return false;
    const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150;
  };
  const upd = () => document.documentElement.classList.toggle("light", light());
  upd(); try { tg.onEvent("themeChanged", upd); } catch (e) {}
  const mo = new MutationObserver(upd); mo.observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
}

/* living sky: the background follows the prayer times of the user's city */
let SKY_ON = true, SKY_CUR = null;
function skyPhase() {
  if (!DATA || !DATA.today) return "night";
  const iso = DATA.today.date, t = DATA.today.t, now = Date.now(), at = k => wall(iso, t[k]);
  if (now < at("Fajr")) return "night";
  if (now < at("Sunrise")) return "dawn";
  if (now < at("Sunrise") + 2.5 * 3600e3 && now < at("Dhuhr")) return "morning";
  if (now < at("Asr")) return "day";
  if (now < at("Maghrib") - 40 * 60e3) return "afternoon";
  if (now < at("Maghrib") + 25 * 60e3) return "sunset";
  if (now < at("Isha")) return "dusk";
  return "night";
}
function updateSky(force) {
  const ph = SKY_ON ? skyPhase() : "off";
  if (ph === SKY_CUR && !force) return;
  SKY_CUR = ph; document.documentElement.setAttribute("data-sky", ph);
}

      ? navigator.geolocation.getCurrentPosition(p => res({lat: p.coords.latitude, lon: p.coords.longitude}), () => res(null), {enableHighAccuracy: true, timeout: 12000})
      : res(null);
    if (ver("8.0") && tg.LocationManager) {
      try {

          if (!tg.LocationManager.isLocationAvailable) return browser();
          tg.LocationManager.getLocation(l => l ? res({lat: l.latitude, lon: l.longitude}) : browser());
        });
        return;
      } catch (e) {}
    }
    browser();
  });
}

/* ───────── QIBLA THEMES ───────── */
const QTHEMES = ["classic", "minimal", "kaaba", "night"];
let QTHEME = "classic";
const QPAL = {
  classic: {face: "var(--card)", ring: "var(--gold)", ringW: 3, big: "var(--text)", small: "var(--hint)", n: "#e65c5c", letter: "var(--text)", arrow: "var(--gold)", arrowW: 6},
  minimal: {face: "none", ring: "var(--line)", ringW: 1.5, big: "var(--hint)", small: null, n: "#e65c5c", letter: "var(--hint)", arrow: "var(--text)", arrowW: 9},
  kaaba: {face: "var(--card)", ring: "var(--gold)", ringW: 2, big: "var(--hint)", small: "var(--line)", n: "#e65c5c", letter: "var(--hint)", arrow: "var(--gold)", arrowW: 5, center: true},
  night: {face: "#060a14", ring: "#4de1ff", ringW: 2.5, big: "#4de1ff", small: "#1f6f86", n: "#ff4fd8", letter: "#bdf6ff", arrow: "#39ff88", arrowW: 6, glow: true}
};
function buildDial() {
  const P = QPAL[QTHEME] || QPAL.classic, c = 150, R = 136, parts = [];
  const f = P.glow ? ' filter="url(#qglow)"' : "";
  if (P.glow) parts.push(`<defs><filter id="qglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`);
  if (P.face !== "none") parts.push(`<circle cx="${c}" cy="${c}" r="${R + 10}" fill="${P.face}"/>`);
  parts.push(`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${P.ring}" stroke-width="${P.ringW}"${f}/>`);
  for (let a = 0; a < 360; a += 5) {
    const big = a % 30 === 0;
    if (!big && !P.small) continue;
    const r1 = R - (big ? 16 : 8), rad = a * Math.PI / 180;
    parts.push(`<line x1="${c + r1 * Math.sin(rad)}" y1="${c - r1 * Math.cos(rad)}" x2="${c + (R - 2) * Math.sin(rad)}" y2="${c - (R - 2) * Math.cos(rad)}" stroke="${big ? P.big : P.small}" stroke-width="${big ? 2.5 : 1.2}"${big ? f : ""}/>`);
  }
  [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([l, a]) => {
    const rad = a * Math.PI / 180, r = R - 36, x = c + r * Math.sin(rad), y = c - r * Math.cos(rad);
    parts.push(`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${QTHEME === "minimal" ? 16 : 22}" font-weight="800" fill="${l === "N" ? P.n : P.letter}" transform="rotate(${a} ${x} ${y})"${f}>${l}</text>`);
  });
  const q = QIBLA * Math.PI / 180, ex = c + (R - 40) * Math.sin(q), ey = c - (R - 40) * Math.cos(q);
  const sx = P.center ? c + 46 * Math.sin(q) : c, sy = P.center ? c - 46 * Math.cos(q) : c;
  parts.push(`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${P.arrow}" stroke-width="${P.arrowW}" stroke-linecap="round"${f}/>`);
  const kx = c + (R - 2) * Math.sin(q), ky = c - (R - 2) * Math.cos(q), ks = QTHEME === "minimal" ? 11 : 17;
  if (P.center) {
    parts.push(`<g transform="translate(${c} ${c}) rotate(${QIBLA})"><rect x="-34" y="-34" width="68" height="68" rx="6" fill="#151515" stroke="var(--gold)" stroke-width="3"/><rect x="-34" y="-18" width="68" height="10" fill="var(--gold)"/><rect x="-8" y="10" width="16" height="24" rx="3" fill="var(--gold)" opacity=".85"/></g>`);
    parts.push(`<circle cx="${kx}" cy="${ky}" r="9" fill="var(--gold)"/>`);
  } else {
    parts.push(`<g transform="translate(${kx} ${ky}) rotate(${QIBLA})"${f}><rect x="-${ks}" y="-${ks}" width="${ks * 2}" height="${ks * 2}" rx="4" fill="${P.glow ? "#060a14" : "#151515"}" stroke="${P.glow ? "#39ff88" : "var(--gold)"}" stroke-width="3"/><rect x="-${ks}" y="-${Math.round(ks / 2)}" width="${ks * 2}" height="${Math.max(3, Math.round(ks / 3))}" fill="${P.glow ? "#39ff88" : "var(--gold)"}"/></g>`);
  }
  $("dial").innerHTML = parts.join("");
  $("compass").className = "compass t-" + QTHEME + (lastOk ? " ok" : "");
  chips($("qThemes"), QTHEMES.map(k => [k, tr("qt_" + k)]), QTHEME, v => { QTHEME = v; store.set("qibla_theme", v); buildDial(); });
  $("qThemeL").textContent = tr("q_theme");
}

const GOALS = [33, 99, 100, 1000], STYLES = ["bead", "ring", "beads"];

const tsCur = () => (TS.data[TS.sel] = TS.data[TS.sel] || {c: 0, total: 0});
let saveT = null;
function saveTasbih() { clearTimeout(saveT); saveT = setTimeout(() => store.set("tasbih2", JSON.stringify(TS)), 500); }
function counterHTML(c) {
  const g = tr("s_goal", {n: TS.goal}), p = Math.min(1, c.c / TS.goal);
  if (TS.style === "ring") {
    const C = 2 * Math.PI * 88;
    return `<button class="ringc" id="tapper"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" class="rb"/><circle cx="100" cy="100" r="88" class="rf" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - p)}"/></svg><div class="in"><div class="n">${c.c}</div><div class="g">${g}</div></div></button>`;
  }
  if (TS.style === "beads") {
    const n = 33, filled = c.c === 0 ? 0 : (c.c % n === 0 ? n : c.c % n), R = 92, beads = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 2 * Math.PI - Math.PI / 2, x = 110 + R * Math.cos(a), y = 110 + R * Math.sin(a);
      beads.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i === filled - 1 ? 9 : 7.2}" class="${i < filled ? "on" : ""}"/>`);

  }

function renderTasbih() {

  let ar, sub;
  if (d.id === "cycle") {

    ar = DHIKR[step][0]; sub = DHIKR[step][1];

function tapBead() {

}

function barChart(title, s, color) {
  const W = 340, H = 110, n = s.length, max = Math.max(1, ...s.map(x => x.c)), bw = W / n, total = s.reduce((a, x) => a + x.c, 0);
  const bars = s.map((x, i) => { const h = Math.max(x.c ? 3 : 1, Math.round((H - 12) * x.c / max)); return `<rect x="${(i * bw + 1).toFixed(1)}" y="${H - h}" width="${(bw - 2).toFixed(1)}" height="${h}" rx="2" fill="${x.c ? color : "var(--line)"}" opacity="${i === n - 1 ? 1 : .8}"/>`; }).join("");
  return `<div class="card"><div class="row between"><b>${title}</b><span class="sub">30 дн: <b>${total}</b> · сегодня <b>${s[n - 1].c}</b></span></div>
    <svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="none">${bars}</svg>
    <div class="row between sub"><span>${shortD(s[0].d)}</span><span>макс. ${max}</span><span>${shortD(s[n - 1].d)}</span></div></div>`;
}
function donut(title, items) {
  const total = items.reduce((a, x) => a + x.c, 0) || 1, C = 2 * Math.PI * 40;
  let off = 0;
  const arcs = items.map((x, i) => { const len = C * x.c / total, s = `<circle cx="60" cy="60" r="40" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`; off += len; return s; }).join("");
  const legend = items.map((x, i) => `<div class="lg"><i style="background:${COLORS[i % COLORS.length]}"></i><span>${esc(x.label)}</span><b>${x.c}</b><span class="sub">${Math.round(100 * x.c / total)}%</span></div>`).join("");
  return `<div class="card"><b>${title}</b><div class="donut"><svg viewBox="0 0 120 120">${items.length ? arcs : `<circle cx="60" cy="60" r="40" fill="none" stroke="var(--line)" stroke-width="18"/>`}<text x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="var(--text)">${items.length ? total : 0}</text></svg><div>${legend || '<div class="sub">нет данных</div>'}</div></div></div>`;
}
function hbars(title, items) {
  const max = Math.max(1, ...items.map(x => x.c));
  return `<div class="card"><b>${title}</b>${items.map(x => `<div class="hb"><span>${esc(x.label)}</span><div><i style="width:${Math.round(100 * x.c / max)}%"></i></div><b>${x.c}</b></div>`).join("") || '<div class="sub" style="margin-top:6px">нет данных</div>'}</div>`;
}

function shrinkPhoto(file) {
  return new Promise((ok, bad) => {
    const rd = new FileReader();
    rd.onerror = bad;
    rd.onload = () => {
      const img = new Image();
      img.onerror = bad;
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL("image/jpeg", 0.86));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

    const lang = d.lang || (d.profile && d.profile.lang); LANG = lang in LX ? lang : "en"; applyLang();
    if (d.need_setup) return stateScreen("📍", tr("need"), tr("to_bot"));
    DATA = d; TZ = d.profile.tz; HSHIFT = null;
    $("boot").hidden = true; $("nav").hidden = false; $("navAdmin").hidden = !d.is_admin;
    renderToday(); renderQibla(); renderMore();
    if (!silent) {
      const qs = new URLSearchParams(location.search), want = qs.get("tab"), sub = qs.get("sub"), az = qs.get("az");
      go(["today", "qibla", "cal", "tasbih", "more"].concat(d.is_admin ? ["admin"] : []).includes(want) ? want : "today");
      if (qs.get("share") === "1") setTimeout(() => sharePrayerTimes(true), 300);
      if (want === "more" && ["tracker", "challenges", "invite", "azkar", "duas", "qada", "dates", "ramadan", "cities", "names", "settings", "ai", "support"].includes(sub)) {
        if (sub === "azkar" && (az === "m" || az === "e")) AZ_MODE = az;
        openSub(sub);
      }
    }
  } catch (e) {
    if (!silent) stateScreen("⚠️", tr("err"));
  }
}
function init() {
  const code = String(tg?.initDataUnsafe?.user?.language_code || navigator.language || "en").slice(0, 2);
  LANG = code in LX ? code : "en"; applyLang();
  $("bootText").textContent = tr("loading");
  if (!tg || !tg.initData) { stateScreen("📱", tr("open_tg")); return; }
  try {
    tg.ready(); tg.expand();
    if (ver("8.0")) { try { tg.lockOrientation(); } catch (e) {} }
    if (ver("7.7")) { try { tg.disableVerticalSwipes(); } catch (e) {} }
    tg.BackButton.onClick(back);
  } catch (e) {}
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { haptic(); go(b.dataset.tab); });
  document.addEventListener("click", e => {
    const s = e.target.closest("[data-sub]"); if (s) { haptic(); openSub(s.dataset.sub); return; }
    if (e.target.closest("[data-back]")) { back(); return; }
    if (e.target.closest("#tapper")) { tapBead(); return; }
    const dz = e.target.closest("[data-dz]"); if (dz) { TS.sel = dz.dataset.dz; haptic(); renderTasbih(); saveTasbih(); return; }
    const g = e.target.closest("#goals button"); if (g) { TS.goal = +g.dataset.g; tsCur().c = 0; haptic(); renderTasbih(); saveTasbih(); return; }
    const sty = e.target.closest("#tStyles button"); if (sty) { TS.style = sty.dataset.st; haptic(); renderTasbih(); saveTasbih(); return; }
    const pr = e.target.closest("[data-person]"); if (pr) { haptic(); openAdmUser(+pr.dataset.person); return; }
    const ad = e.target.closest("#adSeg button"); if (ad) { haptic(); AD_TAB = ad.dataset.ad; renderAdmin(); return; }
    if (e.target.closest("[data-adref]")) { haptic(); renderAdmin(); return; }
    const c = e.target.closest("#trChecks .c"); if (c) { toggleTrack(+c.dataset.i); return; }
    const pt = e.target.closest("#times .t"); if (pt) { haptic(); openPrayerSheet(pt.dataset.k); return; }
    if (e.target.id === "sheet") { closeSheet(); return; }
    const z = e.target.closest(".zk"); if (z) { tapZikr(z.dataset.z); return; }
    const az = e.target.closest("#azSeg button"); if (az) { AZ_MODE = az.dataset.az; haptic(); renderAzkar(); return; }
    const qb = e.target.closest("#qdList .pm"); if (qb) { qdChange(qb.dataset.q, +qb.dataset.d); return; }
    const cv = e.target.closest("#cvSeg button"); if (cv) { haptic(); setCv(cv.dataset.cv); return; }
    const fv = e.target.closest("[data-fav]"); if (fv) { toggleFav(fv.dataset.fav); return; }
  });
  $("tReset").onclick = () => { tsCur().c = 0; haptic("medium"); renderTasbih(); saveTasbih(); };
  $("dCustomIn").oninput = e => { TS.custom = e.target.value; $("dAr").textContent = TS.custom || "…"; saveTasbih(); };
  $("place").onclick = () => { haptic(); openPlace("home", {tab: "today"}); };
  $("stCityChange").onclick = () => { haptic(); openPlace("home", {tab: "more", sub: "settings"}); };
  $("plAuto").onclick = placeAuto; $("plFind").onclick = placeFind; $("plUse").onclick = placeUse;
  $("plQ").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); placeFind(); } };
  $("ciNear").onclick = citiesNear; $("ciMap").onclick = () => { haptic(); openPlace("other", {tab: "more", sub: "cities"}); };
  store.get(["app_theme", "qibla_theme"]).then(v => { applyTheme(v.app_theme || "tg"); if (QTHEMES.includes(v.qibla_theme)) { QTHEME = v.qibla_theme; if (DATA) buildDial(); } });
  $("calPrev").onclick = () => shiftMonth(-1); $("calNext").onclick = () => shiftMonth(1);
  $("moNear").onclick = nearMe;
  $("nSearch").oninput = e => renderNames(e.target.value);
  $("azReset").onclick = () => { AZ = {}; store.set(azKey(), "{}"); haptic("medium"); drawAzkar(); };
  $("qdAdd").onclick = qdAddDays;
  $("ciFind").onclick = findOther;
  $("ciQ").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); findOther(); } };
  $("chCreate").onclick = createChallenge;
  $("aiSend").onclick = aiSend; $("aiNew").onclick = aiReset;
  $("supCustomGo").onclick = () => { const n = parseInt($("supCustom").value, 10); if (n >= 1 && n <= 100000) payInvoice({donate: n}, "sup_thanks"); };
  $("supSent").onclick = async () => { haptic(); try { await apiPost("/api/donate/sent", {}); } catch (e) {} toast(tr("sup_sent_ok")); };
  $("aiIn").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(140, e.target.scrollHeight) + "px"; });
  $("aiIn").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !/Android|iPhone|iPad/i.test(navigator.userAgent)) { e.preventDefault(); aiSend(); } });
  $("invShare").onclick = shareInvite; $("invCopy").onclick = copyInvite;
  store.get(["app_sky"]).then(v => { SKY_ON = v.app_sky !== "0"; updateSky(true); });
  detectLite();
  $("trChBtn").addEventListener("click", () => { CH_FROM = "tracker"; });
  $("trPrev").onclick = () => shiftTrMonth(-1); $("trNext").onclick = () => shiftTrMonth(1);
  ["cvDate", "cvHd", "cvHm", "cvHy"].forEach(id => $(id).addEventListener("input", convert));
  loadTasbih();
  load();
  setInterval(() => { if (TAB === "today" && !SUB) tick(); }, 1000);
}
init();
</script>
</body>
</html>
